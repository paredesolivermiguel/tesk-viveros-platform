name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Compilar APK con EAS Build
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Mostrar enlace de descarga
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "== ULTIMA COMPILACION =="
          eas build:list --platform android --limit 1 --non-interactive --json > /tmp/builds.json
          cat /tmp/builds.json
