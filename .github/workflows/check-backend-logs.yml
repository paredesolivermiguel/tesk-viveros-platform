name: Check Backend Logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Ver ultimos logs del backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "== Estado del servicio =="
            sudo systemctl status tesk-backend --no-pager -l | head -10
            echo ""
            echo "== Contenido de /etc/tesk-backend.env (sin mostrar la contrasena) =="
            sudo sed 's/DATABASE_URL=postgresql:\/\/tesk_app:.*@/DATABASE_URL=postgresql:\/\/tesk_app:***OCULTA***@/' /etc/tesk-backend.env
            echo ""
            echo "== Probando login directo con esa contrasena =="
            DBURL=$(sudo cat /etc/tesk-backend.env | grep DATABASE_URL | cut -d= -f2-)
            PGPASS=$(echo "$DBURL" | sed -n 's|postgresql://tesk_app:\(.*\)@.*|\1|p')
            PGPASSWORD="$PGPASS" psql -h 127.0.0.1 -U tesk_app -d tesk_platform -c "SELECT 'login desde .env: OK' AS resultado;" || echo "FALLO EL LOGIN CON LA CONTRASENA DEL .env"
            echo ""
            echo "== Restableciendo la contrasena por si acaso (idempotente) =="
            sudo -u postgres psql -c "ALTER ROLE tesk_app WITH PASSWORD '${{ secrets.DB_APP_PASSWORD }}';"
            echo "DATABASE_URL=postgresql://tesk_app:${{ secrets.DB_APP_PASSWORD }}@localhost:5432/tesk_platform" | sudo tee /etc/tesk-backend.env.new > /dev/null
            sudo grep JWT_SECRET /etc/tesk-backend.env | sudo tee -a /etc/tesk-backend.env.new > /dev/null
            sudo grep PORT /etc/tesk-backend.env | sudo tee -a /etc/tesk-backend.env.new > /dev/null
            sudo mv /etc/tesk-backend.env.new /etc/tesk-backend.env
            sudo systemctl restart tesk-backend
            sleep 3
            echo "== Estado tras reiniciar =="
            sudo systemctl status tesk-backend --no-pager -l | head -15
            echo ""
            echo "== Concediendo permisos a tesk_app sobre todas las tablas =="
            sudo -u postgres psql -d tesk_platform -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO tesk_app;"
            sudo -u postgres psql -d tesk_platform -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO tesk_app;"
            sudo -u postgres psql -d tesk_platform -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO tesk_app;"
            sudo -u postgres psql -d tesk_platform -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO tesk_app;"

            echo "== Probando SELECT en users como tesk_app =="
            DBURL=$(sudo cat /etc/tesk-backend.env | grep DATABASE_URL | cut -d= -f2-)
            PGPASS=$(echo "$DBURL" | sed -n 's|postgresql://tesk_app:\(.*\)@.*|\1|p')
            PGPASSWORD="$PGPASS" psql -h 127.0.0.1 -U tesk_app -d tesk_platform -c "SELECT count(*) FROM users;"

            sudo systemctl restart tesk-backend
            sleep 3
            echo "== Estado tras reiniciar =="
            sudo systemctl status tesk-backend --no-pager -l | head -10
            echo ""
            echo "== Reseteando contrasena de salicilato@gmail.com a pendiente =="
            sudo -u postgres psql -d tesk_platform -c "UPDATE users SET password_hash = 'MIGRATED_RESET_REQUIRED' WHERE email = 'salicilato@gmail.com';"
            sudo -u postgres psql -d tesk_platform -c "SELECT id, email, role FROM users WHERE email = 'salicilato@gmail.com';"

