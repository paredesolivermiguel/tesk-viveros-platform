name: Diagnose Updates

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Listar canales
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas channel:list --non-interactive || true

      - name: Listar ramas
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas branch:list --non-interactive || true

      - name: Ver detalle del canal preview
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas channel:view preview --non-interactive || true

      - name: Listar actualizaciones publicadas
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update:list --branch preview --non-interactive || true
