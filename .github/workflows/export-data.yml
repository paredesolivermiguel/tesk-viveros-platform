name: Export WordPress Data

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar exportacion
        env:
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
        run: python3 scripts/export_wordpress.py

      - name: Subir export como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-export
          path: export/
          retention-days: 14
