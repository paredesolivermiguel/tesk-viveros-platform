name: Setup Database

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar esquema al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "db/schema.sql"
          target: "/tmp"
          strip_components: 1

      - name: Instalar y configurar PostgreSQL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DB_APP_PASSWORD
          script: |
            set -e
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y postgresql-common
              sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
              sudo apt-get install -y postgresql-16
            fi
            echo "== Version =="
            psql --version

            sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='tesk_app'" | grep -q 1 || \
              sudo -u postgres psql -c "CREATE ROLE tesk_app WITH LOGIN PASSWORD '${DB_APP_PASSWORD}';"

            sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='tesk_platform'" | grep -q 1 || \
              sudo -u postgres psql -c "CREATE DATABASE tesk_platform OWNER tesk_app;"

            PGCONF=$(sudo -u postgres psql -tAc "SHOW config_file;")
            PGHBA=$(sudo -u postgres psql -tAc "SHOW hba_file;")
            sudo sed -i "s/^#\?listen_addresses.*/listen_addresses = 'localhost'/" "$PGCONF"
            sudo grep -q "^local   all             tesk_app" "$PGHBA" || \
              echo "local   all             tesk_app                                md5" | sudo tee -a "$PGHBA"
            sudo systemctl restart postgresql

            sudo -u postgres psql -d tesk_platform -f /tmp/schema.sql

            echo "== Tablas creadas =="
            sudo -u postgres psql -d tesk_platform -c "\dt"

            echo "== Backup automatico diario =="
            sudo mkdir -p /var/backups/postgres
            sudo chown postgres:postgres /var/backups/postgres
            CRONLINE="0 3 * * * postgres pg_dump tesk_platform | gzip > /var/backups/postgres/tesk_platform_\$(date +\%Y\%m\%d).sql.gz"
            echo "$CRONLINE" | sudo tee /etc/cron.d/tesk-db-backup
            sudo find /var/backups/postgres -name '*.sql.gz' -mtime +14 -delete || true

            echo "== FASE 2 COMPLETADA =="
